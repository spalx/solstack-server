name: solstack

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solstack}
      POSTGRES_DB: solstack
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Published on localhost only, for local development and tests.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solstack -d solstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    # BASE_URL, ENCRYPTION_KEY and TRUST_PROXY come from .env; the server refuses to start if they are missing.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://solstack:${POSTGRES_PASSWORD:-solstack}@db:5432/solstack
    # Localhost only: the HTTPS reverse proxy on the same machine is the public entry point. Docker opens
    # published ports past host firewalls such as ufw, so binding to all interfaces would expose plain HTTP.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  db-data:
