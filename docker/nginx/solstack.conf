# Solstack behind Cloudflare. Cloudflare terminates HTTPS and connects here over plain HTTP on port 80
# (Cloudflare SSL mode "Flexible"), so this server has no certificate of its own.

# Cloudflare puts the visitor's address in CF-Connecting-IP; without it every request would appear to
# come from a Cloudflare server and the login rate limit would treat all visitors as one.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Cloudflare says whether the visitor used HTTPS; fall back to this hop's scheme without it.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploading a batch of standards sends up to 5 MB of JSON.
    client_max_body_size 6m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }
}
