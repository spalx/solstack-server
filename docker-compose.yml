name: solstack

# Production stack: Postgres, the app and nginx. Only nginx is reachable from outside, on port 80;
# Cloudflare (or another HTTPS proxy) sits in front of it. Set up with ./setup.sh.
# For local development, docker-compose.dev.yml adds the database port and a test database.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solstack}
      POSTGRES_DB: solstack
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solstack -d solstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # ENCRYPTION_KEY and DOMAIN come from .env (written by ./setup.sh).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: https://${DOMAIN:-}
      # Requests arrive through nginx.
      TRUST_PROXY: 1
      # The password is passed on its own (PGPASSWORD) so any characters in it are safe.
      DATABASE_URL: postgres://solstack@db:5432/solstack
      PGPASSWORD: ${POSTGRES_PASSWORD:-solstack}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/solstack.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
